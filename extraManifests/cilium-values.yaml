ipam:
  mode: kubernetes

# I only have one node
operator:
  replicas: 1

kubeProxyReplacement: true

# KubePrism — Talos's local API server proxy, lets Cilium reach the
# API before pod networking exists
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos manages cgroups itself
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE