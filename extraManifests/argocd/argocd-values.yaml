controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

server:
  replicas: 1

redis:
  enabled: true

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  enabled: false

global:
  # Everything lands on the one node anyway; skip the checks
  affinity:
    podAntiAffinity: soft